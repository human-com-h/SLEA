name: CPU checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_release.py
      - run: python -m compileall -q src scripts examples
      - run: python examples/quick_start.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/rebuild_tables.py
      - run: python scripts/prepare_data.py
